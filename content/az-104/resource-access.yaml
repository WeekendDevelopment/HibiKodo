- id: az-104.identities-governance.resource-access.0006
  cert: az-104
  domain: identities-governance
  skill: resource-access
  type: scenario
  stem: You need to grant a team of developers access to manage all resources within a particular subscription,
    but you do not want them to have access to resources in other subscriptions. Which scope level should
    you apply the role assignment to?
  options:
  - id: a
    text: management group
  - id: b
    text: subscription
  - id: c
    text: resource group
  - id: d
    text: resource
  answer:
  - b
  explanation: The subscription scope applies to all resources within that subscription.
  source_url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
  quote: 'In Azure, you can specify a scope at four levels: management group , subscription, resource
    group , or resource.'
  retrieved_at: 2026-10-29
  difficulty: 1
  tags:
  - RBAC
  - scope
  - subscription
  status: approved
  last_reviewed: 2026-10-29
- id: az-104.identities-governance.resource-access.0008
  cert: az-104
  domain: identities-governance
  skill: resource-access
  type: scenario
  stem: A user has Contributor role at subscription scope and Reader role at a resource group. What permission
    level does the user have on resources within that resource group?
  options:
  - id: a
    text: Contributor
  - id: b
    text: Reader
  - id: c
    text: Owner
  - id: d
    text: No access
  answer:
  - a
  explanation: Because Azure RBAC is additive, the Contributor permissions at subscription scope dominate,
    giving the user Contributor rights on the resource group.
  source_url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
  quote: Consider the following example where a user is granted the Contributor role at the subscription
    scope and the Reader role on a resource group. The sum of the Contributor permissions and the Reader
    permissions is effectively the Contributor role for the subscription.
  retrieved_at: 2026-10-29
  difficulty: 2
  tags:
  - RBAC
  - role assignment
  - permissions
  - subscription
  status: approved
  last_reviewed: 2026-10-29
