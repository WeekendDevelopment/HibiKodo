<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HibiKodo</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e2e0d9;
    --accent: #d6453d; --good: #1f8a4c; --good-bg: #e6f4ec; --bad: #c0392b; --bad-bg: #fbe9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1e1e21; --text: #f1f0ec; --muted: #9a9aa0; --line: #333338;
      --accent: #ef5b52; --good: #4cc182; --good-bg: #17301f; --bad: #ff7b6d; --bad-bg: #3a1c19;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .brand { font-weight: 700; letter-spacing: .02em; }
  .brand span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 14px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .tag { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; margin: 0 6px 12px 0; }
  .tag.retry { color: var(--accent); border-color: var(--accent); }
  h1 { font-size: 19px; line-height: 1.4; margin: 0 0 16px; font-weight: 600; }
  .opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: var(--card); color: var(--text);
         border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font: inherit; cursor: pointer; }
  .opt:hover:not(:disabled) { border-color: var(--muted); }
  .opt.sel { border-color: var(--accent); }
  .opt.right { border-color: var(--good); background: var(--good-bg); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt:disabled { cursor: default; }
  .key { flex: none; width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
  .feedback { margin-top: 16px; padding: 14px; border-radius: 10px; }
  .feedback.good { background: var(--good-bg); } .feedback.bad { background: var(--bad-bg); }
  .feedback b { display: block; margin-bottom: 4px; }
  .feedback.good b { color: var(--good); } .feedback.bad b { color: var(--bad); }
  .feedback a { color: var(--text); }
  .actions { margin-top: 16px; display: flex; justify-content: flex-end; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 11px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .stat { font-size: 40px; font-weight: 700; margin: 8px 0; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  ul.missed { padding-left: 18px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">Hibi<span>Kodo</span></div>
    <div class="meta" id="progressText"></div>
  </header>
  <div class="bar"><div id="bar"></div></div>
  <div id="view"></div>
</main>

<script src="questions.js"></script>
<script>
const view = document.getElementById("view");
const bar = document.getElementById("bar");
const progressText = document.getElementById("progressText");

// Small helpers: Fisher-Yates shuffle, and el() builds DOM nodes with textContent only (never innerHTML),
// so question text from the YAML files can't inject markup.
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => n.append(k));
  return n;
};

// Lesson state (memory only, a reload starts over):
//   queue          items still to ask; a missed question is pushed back on the end with retry: true
//   total          how many distinct questions are in this lesson (the denominator for score/progress)
//   firstTryCorrect / missedFirst / answeredFirst   score only counts the FIRST attempt at each question
let queue, total, firstTryCorrect, missedFirst, answeredFirst;

// Begin (or restart) a lesson with every question in the file, shuffled.
function start() {
  const all = window.QUESTIONS || [];
  if (!all.length) {
    view.replaceChildren(el("div", { className: "card" }, "No questions found. Run: python pipeline/build_app_data.py"));
    return;
  }
  queue = shuffle(all).map(q => ({ q, retry: false }));
  total = queue.length;
  firstTryCorrect = 0;
  missedFirst = [];
  answeredFirst = new Set();
  next();
}

// Show the question at the front of the queue, or the summary when the queue is empty.
function next() {
  if (!queue.length) return finish();
  const done = total - queue.length;
  bar.style.width = (done / total * 100) + "%";
  progressText.textContent = queue.some(x => x.retry) && queue.every(x => x.retry)
    ? `Retrying ${queue.length} missed` : `${Math.min(done + 1, total)} / ${total}`;
  render(queue[0]);
}

// Draw one question card and wire up its answer buttons. `reveal` does the marking when an answer is committed.
function render(item) {
  const q = item.q;
  const multi = q.type === "multi_select";
  const options = shuffle(q.options);
  let chosen = new Set();
  let locked = false;

  const stem = el("h1", {}, q.stem);
  const tags = el("div", {}, el("span", { className: "tag" }, q.skill.replace(/-/g, " ")));
  if (item.retry) tags.append(el("span", { className: "tag retry" }, "Try again"));
  if (multi) tags.append(el("span", { className: "tag" }, `Select ${q.answer.length}`));

  const buttons = options.map((o, i) => {
    const b = el("button", { className: "opt", type: "button" }, el("span", { className: "key" }, String.fromCharCode(65 + i)), el("span", {}, o.text));
    b.dataset.id = o.id;
    b.onclick = () => {
      if (locked) return;
      if (multi) {
        chosen.has(o.id) ? chosen.delete(o.id) : chosen.add(o.id);
        b.classList.toggle("sel", chosen.has(o.id));
        submit.disabled = chosen.size === 0;
      } else {
        chosen = new Set([o.id]);
        reveal();
      }
    };
    return b;
  });

  const feedback = el("div");
  const submit = el("button", { className: "btn", type: "button", disabled: true }, "Check");
  submit.onclick = reveal;
  const actions = el("div", { className: "actions" }, multi ? submit : "");

  function reveal() {
    locked = true;
    const key = new Set(q.answer);
    // Correct means the chosen set equals the key set exactly (matters for multi-select).
    const correct = chosen.size === key.size && [...chosen].every(x => key.has(x));
    buttons.forEach(b => {
      b.disabled = true;
      if (key.has(b.dataset.id)) b.classList.add("right");
      else if (chosen.has(b.dataset.id)) b.classList.add("wrong");
    });
    feedback.className = "feedback " + (correct ? "good" : "bad");
    feedback.replaceChildren(
      el("b", {}, correct ? "Correct" : "Not quite"),
      el("div", {}, q.explanation),
      el("div", { style: "margin-top:8px" }, el("a", { href: q.source_url, target: "_blank", rel: "noopener" }, "Learn more on Microsoft Learn"))
    );
    if (!answeredFirst.has(q.id)) {
      answeredFirst.add(q.id);
      if (correct) firstTryCorrect++; else missedFirst.push(q);
    }
    queue.shift();
    if (!correct) queue.push({ q, retry: true });   // missed questions come back at the end until answered correctly
    submit.remove();
    actions.append(el("button", { className: "btn", type: "button", onclick: next }, queue.length ? "Next" : "Finish"));
  }

  view.replaceChildren(el("div", { className: "card" }, tags, stem, buttons, feedback, actions));
}

// Summary screen: first-try score and the list of questions missed the first time.
function finish() {
  bar.style.width = "100%";
  progressText.textContent = "Done";
  const pct = Math.round(firstTryCorrect / total * 100);
  view.replaceChildren(el("div", { className: "card" },
    el("h1", {}, "Lesson complete"),
    el("div", { className: "stat" }, `${firstTryCorrect} / ${total}`),
    el("p", { className: "hint" }, `${pct}% correct on the first try. Every missed question was asked again at the end until you got it right.`),
    missedFirst.length ? el("div", {}, el("div", { className: "hint" }, "Missed the first time:"), el("ul", { className: "missed" }, missedFirst.map(q => el("li", {}, q.stem)))) : "",
    el("div", { className: "actions" }, el("button", { className: "btn", type: "button", onclick: start }, "Practice again"))
  ));
}

start();
</script>
</body>
</html>
